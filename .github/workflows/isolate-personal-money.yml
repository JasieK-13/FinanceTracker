name: Isolate personal money

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch personal-money isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = [
            ('const POTS = ["Aviation", "Emergency Fund", "General Savings", "Investments", "Other", "Jasiek Personal Money"];', 'const POTS = ["Aviation", "Emergency Fund", "General Savings", "Investments", "Other", "Jasiek Personal Money", "Child Trust Fund"];'),
            ('const NON_FINANCIAL_POTS = new Set(["Jasiek Personal Money"]);', 'const NON_FINANCIAL_POTS = new Set(["Jasiek Personal Money", "Child Trust Fund"]);'),
            ('    data.transactions.forEach(tx => {\n      if (tx.type === "transfer") pots[tx.pot || "Other"] = (pots[tx.pot || "Other"] || 0) + (Number(tx.amount) || 0);', '    data.transactions.forEach(tx => {\n      if (tx.personal) return;\n      if (tx.type === "transfer") pots[tx.pot || "Other"] = (pots[tx.pot || "Other"] || 0) + (Number(tx.amount) || 0);'),
            ('    data.transactions.forEach(tx => {\n      if (monthKey(tx.date) !== mk) return;', '    data.transactions.forEach(tx => {\n      if (tx.personal) return;\n      if (monthKey(tx.date) !== mk) return;'),
            ('    data.transactions.forEach(tx => {\n      if ((tx.type !== "income" && tx.type !== "expense") || !/^\\d{4}-\\d{2}-\\d{2}$/.test(String(tx.date || ""))) return;', '    data.transactions.forEach(tx => {\n      if (tx.personal) return;\n      if ((tx.type !== "income" && tx.type !== "expense") || !/^\\d{4}-\\d{2}-\\d{2}$/.test(String(tx.date || ""))) return;'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:120]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/isolate-personal-money.yml .personal-money-patch-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/isolate-personal-money.yml .personal-money-patch-trigger
          git diff --cached --quiet && exit 0
          git commit -m "Isolate personal money from household tracking"
          git push