  function attachForecastChartHover() {
    const shell = document.getElementById("forecast-chart-shell");
    const svg = document.getElementById("forecast-chart-svg");
    const cross = document.getElementById("forecast-crosshair");
    const line = document.getElementById("forecast-crosshair-line");
    const dot = document.getElementById("forecast-focus-dot");
    const tooltip = document.getElementById("forecast-tooltip");
    const hit = document.getElementById("forecast-hit-area");
    const pinned = document.getElementById("forecast-pinned");
    if (!shell || !svg || !cross || !line || !dot || !tooltip || !hit) return;

    const f = buildForecast(uiState.forecastHorizon || "90");
    const projected = f.daily || [];
    const actual = buildActualHistory(f.end);
    if (!projected.length) return;

    const W = 760, H = 220, padL = 12, padR = 12, padT = 14, padB = 32;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const chartStart = actual.length ? actual[0].date : f.today;
    const chartEnd = f.end;
    const totalDays = Math.max(1, Math.round((chartEnd - chartStart) / 86400000));
    const values = actual.map(d=>d.balance).concat(projected.map(d=>d.balance), [0, f.safetyBuffer]);
    const minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values), span = Math.max(1,maxV-minV);
    const yFor = v => padT + ((maxV - v) / span) * plotH;
    const xForDate = d => padL + (Math.max(0, Math.min(totalDays, (d-chartStart)/86400000)) / totalDays) * plotW;

    const hideHover = () => {
      cross.style.display = "none";
      tooltip.style.display = "none";
      dot.setAttribute("cx", xForDate(f.today).toFixed(2));
      dot.setAttribute("cy", yFor(projected[0].balance).toFixed(2));
    };

    const setTooltip = (clientX, clientY, day, isActual) => {
      const svgRect = svg.getBoundingClientRect();
      const shellRect = shell.getBoundingClientRect();
      if (!svgRect.width || !svgRect.height || !shellRect.width) return;
      const mouseX = clientX - shellRect.left, mouseY = clientY - shellRect.top;
      const tooltipWidth = Math.min(285, Math.max(0, shellRect.width-16));
      let left = mouseX + 12;
      if (left + tooltipWidth > shellRect.width-8) left = mouseX - tooltipWidth - 12;
      left = Math.max(8, Math.min(left, shellRect.width-tooltipWidth-8));
      tooltip.style.left = left + "px";
      tooltip.style.display = "block";
      tooltip.innerHTML = isActual
        ? '<div class="tt-date">Actual · '+esc(formatForecastDate(day.date))+'</div>' +
          '<div class="tt-row"><span>Actual cash</span><b>'+fmt(day.balance)+'</b></div>' +
          '<div class="tt-row"><span>Daily change</span><b style="color:'+(day.net<0?'var(--bad)':'var(--good)')+';">'+(day.net>=0?'+':'')+fmt(day.net)+'</b></div>' +
          '<div class="tt-row"><span>Safe amount after buffer</span><b>'+fmt(Number(day.balance)-Number(f.potTotal||0)-Number(f.safetyBuffer||0))+'</b></div>' +
          '<div class="tt-row"><span>Income</span><b>+'+fmt(day.income)+'</b></div>' +
          '<div class="tt-row"><span>Fixed bills</span><b>—</b></div>' +
          '<div class="tt-row"><span>Budget spending</span><b>—</b></div>' +
          '<div class="tt-row"><span>Planned expenses</span><b>—</b></div>' +
          '<div class="tt-row"><span>Actual spending</span><b>-'+fmt(day.expense)+'</b></div>' +
          ((day.events||[]).length ? '<div class="tt-events"><div class="tt-events-title">Actual events</div>'+day.events.map(e=>'<div class="tt-event"><span>'+esc(e.reason)+'</span><span>'+(e.amount>=0?'+':'-')+fmt(Math.abs(e.amount))+'</span></div>').join('')+'</div>' : '<div class="tt-events"><div class="tt-events-title">Actual events</div><div class="small-muted">No actual income or spending on this date.</div></div>')
        : forecastTooltipHtml(f, day, "Projected");
      const h = tooltip.offsetHeight || 160;
      let top = mouseY + 12;
      if (top + h > shellRect.height-8) top = mouseY - h - 12;
      top = Math.max(8, Math.min(top, shellRect.height-h-8));
      tooltip.style.top = top + "px";
    };

    let raf = 0;
    let pending = null;
    const process = () => {
      raf = 0;
      if (!pending) return;
      const e = pending; pending = null;
      const ctm = svg.getScreenCTM && svg.getScreenCTM();
      if (!ctm) return;
      const point = svg.createSVGPoint();
      point.x = e.clientX; point.y = e.clientY;
      const svgPoint = point.matrixTransform(ctm.inverse());
      const svgX = Math.max(padL, Math.min(W-padR, svgPoint.x));
      const ratio = (svgX-padL)/plotW;
      const hoverDate = new Date(chartStart); hoverDate.setDate(hoverDate.getDate() + Math.round(ratio*totalDays)); hoverDate.setHours(0,0,0,0);

      // Exact pointer X drives the vertical cursor. Only the data point snaps to a date.
      line.setAttribute("x1", svgX.toFixed(2));
      line.setAttribute("x2", svgX.toFixed(2));
      line.setAttribute("y1", String(padT));
      line.setAttribute("y2", String(H-padB));

      let day = null, isActual = false;
      if (hoverDate <= f.today && actual.length) {
        const key = dateKeyLocal(hoverDate);
        day = actual.find(d=>d.key===key);
        if (day) isActual = true;
      }
      if (!day) {
        const idx = Math.max(0, Math.min(projected.length-1, Math.round((hoverDate-f.today)/86400000)));
        day = projected[idx];
      }
      const pointX = xForDate(day.date);
      dot.setAttribute("cx", pointX.toFixed(2));
      dot.setAttribute("cy", yFor(day.balance).toFixed(2));
      cross.style.display = "block";
      setTooltip(e.clientX, e.clientY, day, isActual);
    };
    const schedule = e => { pending = e; if (!raf) raf = requestAnimationFrame(process); };

    const pinAt = e => {
      const ctm = svg.getScreenCTM && svg.getScreenCTM();
      if (!ctm) return;
      const point = svg.createSVGPoint(); point.x=e.clientX; point.y=e.clientY;
      const p = point.matrixTransform(ctm.inverse());
      const svgX = Math.max(padL, Math.min(W-padR, p.x));
      const ratio = (svgX-padL)/plotW;
      const d = new Date(chartStart); d.setDate(d.getDate()+Math.round(ratio*totalDays));
      const key = dateKeyLocal(d);
      uiState.forecastPinnedDate = key;
      render();
    };

    hit.addEventListener("pointermove", schedule, {passive:true});
    hit.addEventListener("pointerenter", schedule, {passive:true});
    hit.addEventListener("pointerleave", hideHover, {passive:true});
    hit.addEventListener("pointerdown", e => { if (e.button === 0) e.preventDefault(); }, {passive:false});
    hit.addEventListener("click", pinAt);
  }

    const sumInput = document.getElementById("calc-sum-input"); if (sumInput) sumInput.oninput = recomputeSum; recomputeSum();
    const affordInput = document.getElementById("calc-afford-amount"); if (affordInput) affordInput.oninput = () => recomputeAfford(t); recomputeAfford(t);
    document.querySelectorAll('[data-action="calc-use-expense"]').forEach(b => { b.onclick = () => { const ta = document.getElementById("calc-sum-input"); const matches = ((ta && ta.value) || "").match(/-?\d+(\.\d+)?/g) || []; const total = matches.map(Number).reduce((a, x) => a + x, 0); activeTab = "spending"; updateTabUI(); render(); setTimeout(() => { const el = document.getElementById("exp-amount"); if (el) el.value = total.toFixed(2); }, 0); }; });
    document.querySelectorAll('[data-action="calc-log-afford"]').forEach(b => { b.onclick = () => { const input = document.getElementById("calc-afford-amount"); const amt = parseFloat(input && input.value) || 0; if (!amt) return; activeTab = "spending"; updateTabUI(); render(); setTimeout(() => { const el = document.getElementById("exp-amount"); if (el) el.value = amt.toFixed(2); }, 0); }; });
  }

  function updateTabUI() { document.querySelectorAll("#tabs button").forEach(b => { b.classList.toggle("active", b.dataset.tab === activeTab); }); }

  init();
})();
<!-- Household Ledger cloud-ready: Supabase browser client + RLS -->
</script>
