<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Household Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FBF5EC; --surface: #FFFFFF; --surface-2: #F5ECDD; --border: #EADFC8;
    --text: #3A2E22; --text-2: #7A6A54; --text-3: #A69783;
    --accent: #D97A4D; --accent-soft: #FBE4D3;
    --good: #6B9E5D; --good-soft: #E8F1E0;
    --warn: #D9A441; --warn-soft: #FBF0DA;
    --bad: #C75B4A; --bad-soft: #FAE4DF;
    --aviation: #8C6FB0; --aviation-soft: #F0E8F7;
    --radius: 14px; --radius-sm: 10px;
    --font-ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-num: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1E1712; --surface: #2A2119; --surface-2: #332920; --border: #453727;
      --text: #F2E9DD; --text-2: #C4B29D; --text-3: #8F7C68;
      --accent: #E38E5C; --accent-soft: #3D2A1D;
      --good: #7FB56E; --good-soft: #23301C;
      --warn: #E3B559; --warn-soft: #362A15;
      --bad: #DD7A67; --bad-soft: #3A241E;
      --aviation: #A98FCB; --aviation-soft: #2D2438;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1E1712; --surface: #2A2119; --surface-2: #332920; --border: #453727;
    --text: #F2E9DD; --text-2: #C4B29D; --text-3: #8F7C68;
    --accent: #E38E5C; --accent-soft: #3D2A1D;
    --good: #7FB56E; --good-soft: #23301C;
    --warn: #E3B559; --warn-soft: #362A15;
    --bad: #DD7A67; --bad-soft: #3A241E;
    --aviation: #A98FCB; --aviation-soft: #2D2438;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; padding-bottom: 40px; padding-top: env(safe-area-inset-top, 0px); }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  header.masthead { padding: 14px 20px 10px; border-bottom: 1px solid var(--border); background: var(--surface); padding-top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px; }
  .masthead-title { font-size: 15px; font-weight: 800; color: var(--text-2); }
  .masthead-today { font-size: 12px; color: var(--text-3); }
  nav.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); -ms-overflow-style: none; scrollbar-width: none; }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button { background: none; border: none; color: var(--text-2); font-family: var(--font-ui); font-size: 14px; font-weight: 700; padding: 6px 13px; cursor: pointer; white-space: nowrap; border-radius: 999px; }
  nav.tabs button.active { color: #fff; background: var(--accent); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { max-width: 1400px; width: 95%; margin: 0 auto; padding: 14px 4px 20px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 640px) { .grid3 { grid-template-columns: 1fr; } .grid2 { grid-template-columns: 1fr; } main { width: 100%; padding: 12px; } }
  .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .hero-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: 0 1px 3px rgba(58,46,34,0.05); }
  .hero-card .hc-label { font-size: 11px; font-weight: 800; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
  .hero-card .hc-value { font-size: 24px; font-weight: 800; font-family: var(--font-num); line-height: 1.1; }
  .hero-card .hc-sub { font-size: 11px; color: var(--text-2); margin-top: 4px; }
  .hero-card.cash { border-top: 4px solid var(--accent); }
  .hero-card.committed { border-top: 4px solid var(--warn); }
  .hero-card.safe { border-top: 4px solid var(--good); }
  .why-link { background: none; border: none; color: var(--accent); font-size: 11px; font-weight: 700; cursor: pointer; padding: 0; font-family: var(--font-ui); text-transform: none; letter-spacing: 0; }
  .why-panel { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 12px; }
  .why-row { display: flex; justify-content: space-between; padding: 2px 0; color: var(--text-2); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: 0 1px 3px rgba(58,46,34,0.05); }
  .card-compact { padding: 10px 12px; }
  .card-label { font-size: 12px; color: var(--text-3); margin-bottom: 6px; font-weight: 700; }
  .card-value { font-size: 19px; font-weight: 700; font-family: var(--font-num); }
  .card-sub { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .section-title { font-size: 15px; font-weight: 800; margin: 18px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .section-title.first { margin-top: 2px; }
  .pot-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .pot-row:last-child { border-bottom: none; }
  .pot-row-top { display: flex; justify-content: space-between; align-items: center; }
  .pot-name { font-size: 14px; font-weight: 700; }
  .pot-amt { font-size: 14px; font-weight: 700; font-family: var(--font-num); }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--aviation); border-radius: 4px; }
  .progress-fill.budget-ok { background: var(--good); }
  .progress-fill.budget-warn { background: var(--warn); }
  .progress-fill.budget-over { background: var(--bad); }
  .list-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  .list-item:last-child { border-bottom: none; }
  .li-main { flex: 1; min-width: 140px; }
  .li-title { font-size: 13px; font-weight: 700; }
  .li-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .li-amt { font-size: 13px; font-weight: 700; font-family: var(--font-num); white-space: nowrap; }
  .amt-pos { color: var(--good); }
  .amt-neg { color: var(--text); }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); margin-right: 4px; }
  .tag.essential { background: var(--warn-soft); color: var(--warn); }
  .tag.overdue { background: var(--bad-soft); color: var(--bad); }
  .tag.good { background: var(--good-soft); color: var(--good); }
  .btn { font-family: var(--font-ui); font-size: 12px; font-weight: 700; padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; }
  .btn:hover { background: var(--border); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); border-radius: 999px; padding: 8px 16px; }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 4px 9px; font-size: 11px; border-radius: 999px; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .empty { color: var(--text-3); font-size: 12px; padding: 12px 0; text-align: center; }
  form.entry { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(58,46,34,0.05); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .field-row.single { grid-template-columns: 1fr; }
  .field-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--text-3); font-weight: 700; }
  .field input, .field select, .field textarea { font-family: var(--font-ui); font-size: 13px; padding: 8px 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); width: 100%; }
  .field textarea { font-family: var(--font-num); resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; padding: 3px; background: var(--surface-2); }
  .seg button { flex: 1; padding: 6px; font-size: 12px; font-weight: 700; font-family: var(--font-ui); border: none; background: none; color: var(--text-2); cursor: pointer; border-radius: 999px; }
  .seg button.active { background: var(--accent); color: #fff; }
  .row-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
  .filter-select { font-family: var(--font-ui); font-size: 12px; font-weight: 700; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); }
  .inline-log { background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px; margin-top: 8px; flex-basis: 100%; }
  .note { font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .link-btn { background: none; border: none; color: var(--accent); font-size: 12px; font-weight: 700; cursor: pointer; padding: 0; font-family: var(--font-ui); }
  h1, h2, h3 { font-weight: 800; margin: 0; }
  .loading-msg { text-align: center; color: var(--text-3); padding: 40px 0; font-size: 13px; }
  .banner { border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner button { background: none; border: none; color: inherit; cursor: pointer; font-size: 14px; line-height: 1; padding: 0 0 0 8px; }
  .month-nav { display: flex; align-items: center; gap: 8px; justify-content: center; margin-bottom: 8px; }
  .month-nav button { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; width: 28px; height: 28px; font-size: 13px; cursor: pointer; color: var(--text); }
  .month-nav .label { font-size: 13px; font-weight: 700; min-width: 130px; text-align: center; }
  .chart-wrap { padding: 4px 0 0; }
  .chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .chart-label { font-size: 11px; color: var(--text-2); width: 84px; flex-shrink: 0; }
  .chart-bar-track { flex: 1; background: var(--surface-2); border-radius: 5px; height: 12px; overflow: hidden; }
  .chart-bar-fill { height: 100%; border-radius: 5px; }
  .chart-amt { font-size: 11px; font-family: var(--font-num); width: 68px; text-align: right; flex-shrink: 0; }
  .more-subnav { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .more-subnav button { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700; color: var(--text-2); cursor: pointer; }
  .more-subnav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* Calendar */
  .cal-layout { display: flex; gap: 14px; align-items: flex-start; }
  .cal-main { flex: 1; min-width: 0; }
  .cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-weekdays { margin-bottom: 6px; }
  .cal-weekdays span { font-size: 10px; color: var(--text-3); text-align: center; font-weight: 700; }
  .cal-cell { min-height: 58px; border-radius: var(--radius-sm); background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 4px 2px; font-size: 11px; font-weight: 700; cursor: pointer; gap: 2px; border: 2px solid transparent; overflow: hidden; }
  @media (min-width: 900px) { .cal-cell { min-height: 78px; padding: 6px 4px; } }
  .cal-cell.empty { background: transparent; cursor: default; }
  .cal-cell.today { border-color: var(--accent); }
  .cal-cell.selected { background: var(--accent-soft); }
  .cal-daynum { font-size: 11px; }
  .cal-amt { font-size: 10px; font-weight: 800; color: var(--good); line-height: 1.2; }
  .cal-amt.neg { color: var(--bad); }
  .cal-dots { display: flex; gap: 2px; height: 5px; margin-top: 2px; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; }
  .cal-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--text-3); margin-top: 8px; }
  .cal-legend span { display: flex; align-items: center; gap: 4px; }
  .cal-legend .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  #cal-day-backdrop { position: fixed; inset: 0; background: rgba(58,46,34,0.25); z-index: 49; display: none; }
  #cal-day-backdrop.open { display: block; }
  #cal-day-panel { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border); display: none; }
  #cal-day-panel.open { display: block; }
  @media (min-width: 900px) {
    #cal-day-panel { top: 0; right: 0; bottom: 0; width: 340px; overflow-y: auto; padding: 18px; box-shadow: -4px 0 16px rgba(58,46,34,0.1); border-radius: 0; }
    .cal-layout { flex-wrap: nowrap; }
  }
  @media (max-width: 899px) {
    #cal-day-panel { left: 0; right: 0; bottom: 0; max-height: 72vh; overflow-y: auto; padding: 16px; border-radius: 18px 18px 0 0; box-shadow: 0 -4px 16px rgba(58,46,34,0.14); }
  }
  .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .panel-head button { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-2); }

  #fab-add { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #fff; border: none; font-size: 26px; line-height: 1; cursor: pointer; box-shadow: 0 4px 14px rgba(217,122,77,0.4); display: flex; align-items: center; justify-content: center; font-family: var(--font-ui); }
  #fab-add:hover { filter: brightness(1.06); }
  #quick-add-sheet { position: fixed; right: 18px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: min(330px, calc(100vw - 36px)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: 0 8px 24px rgba(58,46,34,0.18); }
  #quick-add-sheet[hidden] { display: none; }
  .qa-head { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 13px; margin-bottom: 10px; }
  .qa-head button { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--text-2); }
  .qa-choices { display: flex; gap: 8px; }
  .qa-choices button { flex: 1; padding: 12px 6px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface-2); font-family: var(--font-ui); font-weight: 700; font-size: 11px; cursor: pointer; color: var(--text); }
  .qa-choices button:hover { background: var(--border); }

  /* V4 UX: calendar-first compact home */
  .add-details { margin-bottom: 10px; }
  .add-details > summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 12px; font-weight: 800; }
  .add-details > summary::-webkit-details-marker { display: none; }
  .add-details[open] > summary { margin-bottom: 8px; }
  .add-details .entry { margin-bottom: 0; }
  .calendar-focus { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, .85fr); gap: 14px; align-items: start; }
  .calendar-focus-main { min-width: 0; }
  .calendar-focus-side { display: grid; gap: 10px; min-width: 0; }
  .calendar-focus-side .section-title { margin: 0 0 6px; }
  .calendar-card { padding: 10px; }
  .side-card { padding: 11px 12px; }
  .side-card .list-item { padding: 7px 0; }
  .side-card .li-title { font-size: 12px; }
  .side-card .li-sub { font-size: 10px; }
  .side-card .li-amt { font-size: 12px; }
  .mini-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mini-summary .card { padding: 9px 10px; }
  .mini-summary .card-value { font-size: 16px; }
  .cal-cell { min-height: 62px; }
  @media (min-width: 900px) { .cal-cell { min-height: 70px; } }
  @media (max-width: 899px) { .calendar-focus { grid-template-columns: 1fr; } .calendar-focus-side { grid-template-columns: 1fr; } }
  @media (min-width: 1400px) { .calendar-focus { grid-template-columns: minmax(0, 2.2fr) minmax(340px, .9fr); } }

  /* V4.3 usability fixes */
  .grid3 { align-items: start; }
  .calendar-focus { margin-top: 10px; }
  .calendar-focus-side { position: relative; z-index: 1; margin-top: 2px; overflow: visible; }
  .hero-card, .side-card { overflow: visible; }
  .month-nav .btn.small[data-action="cal-today"] { width: auto; min-width: 58px; height: 28px; padding: 5px 10px; flex: 0 0 auto; white-space: nowrap; }
  .month-nav { flex-wrap: wrap; }
  .add-section { margin-bottom: 14px; }
  .add-section.closed { display: flex; justify-content: flex-start; }
  .add-section.open .add-section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .preset-note { font-size: 11px; color: var(--text-2); margin-top: 3px; }
  .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .stats-grid .card { padding:9px 10px; }
  .stats-grid .card-value { font-size:16px; }
  .fuel-history { max-height: 280px; overflow:auto; margin-top:8px; border-top:1px solid var(--border); padding-top:4px; }
  .planning-tip { background: var(--aviation-soft); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; color:var(--text-2); font-size:12px; }
  .planning-tip strong { color:var(--text); }

  /* V5 Financial Safety Engine */
  .safety-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; box-shadow: 0 1px 3px rgba(58,46,34,0.05); margin-bottom: 10px; }
  .safety-top { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .safety-title { font-size:15px; font-weight:800; }
  .safety-sub { font-size:11px; color:var(--text-2); margin-top:3px; }
  .safety-horizon { display:flex; gap:4px; flex-wrap:wrap; }
  .safety-horizon button { background:var(--surface-2); border:1px solid var(--border); color:var(--text-2); border-radius:999px; padding:5px 9px; font:700 11px var(--font-ui); cursor:pointer; }
  .safety-horizon button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .safety-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px; }
  .safety-stat { background:var(--surface-2); border-radius:var(--radius-sm); padding:10px; min-width:0; }
  .safety-stat .label { font-size:10px; color:var(--text-3); font-weight:800; text-transform:uppercase; letter-spacing:.03em; }
  .safety-stat .value { margin-top:4px; font:800 18px var(--font-num); }
  .safety-stat .sub { margin-top:3px; font-size:10px; color:var(--text-2); line-height:1.35; }
  .forecast-chart-shell { position:relative; width:100%; max-width:1100px; margin:0 auto; touch-action:pan-y; }
  .forecast-chart-shell svg { display:block; width:100%; height:auto; aspect-ratio:760 / 220; overflow:visible; }
  .forecast-hit-area { fill:transparent; }
  .forecast-crosshair { pointer-events:none; display:none; }
  .forecast-crosshair line { stroke:var(--text-2); stroke-width:1.25; stroke-dasharray:4 4; opacity:.9; }
  .forecast-focus-dot { fill:var(--surface); stroke:var(--accent); stroke-width:2.5; }
  .forecast-tooltip { position:absolute; z-index:5; width:min(285px, calc(100% - 16px)); background:var(--surface); border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 18px rgba(58,46,34,.16); padding:9px 10px; pointer-events:none; display:none; font-size:11px; line-height:1.4; }
  .forecast-tooltip .tt-date { font-weight:800; font-size:12px; margin-bottom:5px; }
  .forecast-tooltip .tt-row { display:flex; justify-content:space-between; gap:10px; color:var(--text-2); }
  .forecast-tooltip .tt-row b { color:var(--text); font-family:var(--font-num); white-space:nowrap; }
  .forecast-tooltip .tt-events { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); }

      },
      async update(patch) {
        if (collection === "settings" && id === "config") {
          const existing = await cloudFetchDoc(path);
          const next = Object.assign({}, existing.data() || {}, cloneData(patch || {}));
          const { error } = await supabaseClient.from("settings").upsert({ household_id:cloudHouseholdId, data:next }, { onConflict:"household_id" });
          if (error) throw error;
          return;
        }
        const existing = await cloudFetchDoc(path);
        const next = Object.assign({}, existing.data() || {}, cloneData(patch || {}));
        const { error } = await supabaseClient.from(collection).upsert({ id, household_id:cloudHouseholdId, data:next }, { onConflict:"household_id,id" });
        if (error) throw error;
      },
      async delete() {
        if (collection === "settings" && id === "config") {
          const { error } = await supabaseClient.from("settings").delete().eq("household_id",cloudHouseholdId);
          if (error) throw error;
          return;
        }
        const { error } = await supabaseClient.from(collection).delete().eq("household_id",cloudHouseholdId).eq("id",id);
        if (error) throw error;
      },
      onSnapshot(next, errorCb) {
        let active = true;
        const emit = async () => {
          if (!active) return;
          try { next(await cloudFetchDoc(path)); }
          catch (e) { if (errorCb) errorCb(e); }
        };
        emit();
        cloudUnsubscribers.push(() => { active=false; });
        return () => { active=false; };
      }
    };
  }

  function createSupabaseDb() {
    if (!window.supabase || typeof window.supabase.createClient !== "function") throw new Error("Supabase library failed to load.");
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { autoRefreshToken:true, persistSession:true, detectSessionInUrl:true }
    });
    return {
      doc: cloudMakeDocRef,
      collection: name => cloudMakeCollectionRef(name)
    };
  }

  function renderCloudMigration(message="") {
    cloudMigrationNeeded = true;
    const msg = message ? '<div class="auth-error">'+esc(message)+'</div>' : '';
    document.getElementById("main").innerHTML = '<div class="cloud-migration"><div class="cloud-migration-card">' +
      '<div class="auth-title">Move your existing ledger to the cloud</div>' +
      '<div class="auth-sub">Your Supabase account is connected, but this new cloud database is empty. Do not start entering new transactions here yet. First export your existing V5.4 ledger as JSON and import that backup here.</div>' +
      '<div class="cloud-migration-step"><b>1.</b> Open your existing V5.4 tracker and go to <b>More → Backup</b>.<br><b>2.</b> Click <b>Export data (.json)</b>.<br><b>3.</b> Select that JSON file below.</div>' +
      '<div class="field" style="margin-top:14px;"><label>Existing Household Ledger backup (.json)</label><input id="cloud-import-file" type="file" accept="application/json,.json"></div>' +
      '<div class="row-actions"><button class="btn primary" id="cloud-import-btn" disabled>Import existing ledger</button><button class="btn small" id="cloud-signout-migration">Sign out</button></div>' +
      msg +
      '<div class="small-muted" style="margin-top:10px;">This import does not affect the old ledger. It copies its records into this new cloud database.</div>' +
      '</div></div>';
    const input=document.getElementById("cloud-import-file"), btn=document.getElementById("cloud-import-btn");
    if(input&&btn) input.onchange=()=>{ btn.disabled=!(input.files&&input.files[0]); };
    if(btn) btn.onclick=async()=>{
      const file=input && input.files && input.files[0]; if(!file) return;
      btn.disabled=true; btn.textContent="Importing…";
      try {
        const backup=JSON.parse(await file.text());
        const txs=Array.isArray(backup.transactions)?backup.transactions:[];
        const commitments=Array.isArray(backup.commitments)?backup.commitments:[];
        const scheduled=Array.isArray(backup.scheduled_income)?backup.scheduled_income:(Array.isArray(backup.scheduled)?backup.scheduled:[]);
        const aviation=Array.isArray(backup.aviation)?backup.aviation:[];
        if(!backup.config || typeof backup.config !== "object") throw new Error("This does not look like a Household Ledger JSON backup (config is missing).");
        const [existingTx,existingC,existingS,existingA,existingSettings] = await Promise.all([
          supabaseClient.from("transactions").select("id",{count:"exact",head:true}).eq("household_id",cloudHouseholdId),
          supabaseClient.from("commitments").select("id",{count:"exact",head:true}).eq("household_id",cloudHouseholdId),
          supabaseClient.from("scheduled_income").select("id",{count:"exact",head:true}).eq("household_id",cloudHouseholdId),
          supabaseClient.from("aviation").select("id",{count:"exact",head:true}).eq("household_id",cloudHouseholdId),
          supabaseClient.from("settings").select("household_id",{count:"exact",head:true}).eq("household_id",cloudHouseholdId)
        ]);
        for (const q of [existingTx,existingC,existingS,existingA,existingSettings]) if(q.error) throw q.error;
        if([existingTx.count,existingC.count,existingS.count,existingA.count,existingSettings.count].some(n=>Number(n||0)>0)) throw new Error("The cloud household already contains data. Migration was stopped to avoid overwriting it.");

        const upsertBatch=async(table, rows)=>{
          const payload=rows.map(row=>({id:String(row.id), household_id:cloudHouseholdId, data:cloneData(Object.assign({},row,{id:undefined}))}));
          payload.forEach(x=>{ delete x.data.id; });
          if(!payload.length) return;
          for(let i=0;i<payload.length;i+=200){ const {error}=await supabaseClient.from(table).insert(payload.slice(i,i+200)); if(error) throw error; }
        };
        const config=Object.assign({},backup.config,{cloudReady:true});
        const {error:settingsError}=await supabaseClient.from("settings").insert({household_id:cloudHouseholdId,data:cloneData(config)}); if(settingsError) throw settingsError;
        await upsertBatch("transactions",txs);
        await upsertBatch("commitments",commitments);
        await upsertBatch("scheduled_income",scheduled);
        await upsertBatch("aviation",aviation);
        cloudMigrationNeeded=false;
        await refreshCloudData();
        subscribeCloudRealtime();
      } catch(e) {
        console.error("cloud import error",e);
        btn.disabled=false; btn.textContent="Import existing ledger";
        renderCloudMigration(e && e.message ? e.message : String(e));
      }
    };
    const so=document.getElementById("cloud-signout-migration"); if(so) so.onclick=async()=>{await supabaseClient.auth.signOut();};
  }

  function clearCloudSubscriptions() {
    cloudUnsubscribers.forEach(fn => { try { fn(); } catch (e) {} });
    cloudUnsubscribers = [];
    if (cloudChannel && supabaseClient) { try { supabaseClient.removeChannel(cloudChannel); } catch (e) {} }
    cloudChannel = null;
    if (cloudPollTimer) { clearInterval(cloudPollTimer); cloudPollTimer = null; }
  }

  async function refreshCloudData() {
    if (!db || !cloudUser || !cloudHouseholdId || !CLOUD_MODE) return false;
    try {
      const [settings, txs, commitments, scheduled, aviation] = await Promise.all([
        cloudFetchDoc("settings/config"),
        cloudFetchCollection("transactions","date","desc",null),
        cloudFetchCollection("commitments",null,"asc",null),
        cloudFetchCollection("scheduled_income","expectedDate","asc",null),
        cloudFetchCollection("aviation","date","desc",500)
      ]);

      // A cloud household is considered migrated only when its settings record
      // explicitly carries cloudReady=true. This prevents a partial/old settings
      // row from making the UI render an empty ledger before migration is complete.
      if (!settings.exists || settings.data().cloudReady !== true) {
        cloudMigrationNeeded = true;
        data.config = Object.assign({}, data.config);
        data.transactions=[]; data.commitments=[]; data.scheduled=[]; data.aviation=[];
        ready={config:false,transactions:false,commitments:false,scheduled:false,aviation:false};
        renderCloudMigration();
        return false;
      }

      cloudMigrationNeeded = false;
      const d=settings.data();
      data.config=Object.assign(data.config,d,{potTargets:d.potTargets||{},schemaVersion:Number(d.schemaVersion||0),calendarNotes:d.calendarNotes||{}});
      data.transactions=txs.docs.map(d=>Object.assign({id:d.id},d.data()));
      data.commitments=commitments.docs.map(d=>Object.assign({id:d.id},d.data()));
      data.scheduled=scheduled.docs.map(d=>Object.assign({id:d.id},d.data()));
      data.aviation=aviation.docs.map(d=>Object.assign({id:d.id},d.data()));
      ready={config:true,transactions:true,commitments:true,scheduled:true,aviation:true};
      render();
      return true;
    } catch (e) {
      markBootError("Couldn't sync the cloud ledger", e);
      return false;
    }
  }

  function subscribeCloudRealtime() {
    clearCloudSubscriptions();
    cloudChannel = supabaseClient.channel("household-ledger-" + cloudHouseholdId)
      .on("postgres_changes", {event:"*", schema:"public", table:"settings", filter:"household_id=eq."+cloudHouseholdId}, () => refreshCloudData())
      .on("postgres_changes", {event:"*", schema:"public", table:"transactions", filter:"household_id=eq."+cloudHouseholdId}, () => refreshCloudData())
      .on("postgres_changes", {event:"*", schema:"public", table:"commitments", filter:"household_id=eq."+cloudHouseholdId}, () => refreshCloudData())
      .on("postgres_changes", {event:"*", schema:"public", table:"scheduled_income", filter:"household_id=eq."+cloudHouseholdId}, () => refreshCloudData())
      .on("postgres_changes", {event:"*", schema:"public", table:"aviation", filter:"household_id=eq."+cloudHouseholdId}, () => refreshCloudData())
      .subscribe(status => {
        if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") {
          if (!cloudPollTimer) cloudPollTimer = setInterval(refreshCloudData, 15000);
        }
      });
    if (!cloudPollTimer) cloudPollTimer = setInterval(refreshCloudData, 30000);
  }

  function renderAuth(errorMessage="") {
    clearCloudSubscriptions();
    const existingAccount=document.getElementById("cloud-account");
    if(existingAccount) existingAccount.remove();
    document.getElementById("main").innerHTML = '<div class="auth-shell"><div class="auth-card">' +
      '<div class="auth-title">Household Ledger</div>' +
      '<div class="auth-sub">Sign in to access your shared household ledger. Your financial data is stored in the cloud and protected by your household membership.</div>' +
      '<form id="cloud-login-form" style="margin-top:16px;">' +
      '<div class="field"><label>Email</label><input id="cloud-email" type="email" autocomplete="email" required></div>' +
      '<div class="field" style="margin-top:8px;"><label>Password</label><input id="cloud-password" type="password" autocomplete="current-password" required></div>' +
      '<div class="row-actions"><button class="btn primary" type="submit">Sign in</button></div>' +
      (errorMessage ? '<div class="auth-error">'+esc(errorMessage)+'</div>' : '') +
      '</form></div></div>';
    const form=document.getElementById("cloud-login-form");
    if(form) form.onsubmit=async e=>{
      e.preventDefault();

        btn.disabled=false; btn.textContent="Sign in"; renderAuth(error.message);
        return;
      }
      // Apply the returned session immediately. The auth-state callback also
      // runs, but the serialised handler makes the operation idempotent.
      if(authData && authData.session) await applyCloudSession(authData.session);

  }

  async function applyCloudSession(session) {
    cloudAuthSerial = cloudAuthSerial.then(async () => {
      if (!session) {
        const greeting = document.getElementById("app-greeting");
        if (greeting) { greeting.textContent = ""; greeting.hidden = true; }
        clearCloudSubscriptions();
        cloudUser=null;
        cloudHouseholdId=null;
        cloudMigrationNeeded=false;
        cloudInitComplete=false;
        bootError=null;
        ready={config:false,transactions:false,commitments:false,scheduled:false,aviation:false};
        const account=document.getElementById("cloud-account"); if(account) account.remove();
        renderAuth();
        return;
      }

      const sameUser = cloudUser && cloudUser.id === session.user.id;
      if (sameUser && cloudHouseholdId && (cloudMigrationNeeded || (ready.config && ready.transactions && ready.commitments && ready.scheduled && ready.aviation))) {
        return;
      }

      clearCloudSubscriptions();
      cloudUser=session.user;
      cloudHouseholdId=null;
      cloudMigrationNeeded=false;
      cloudInitComplete=false;
      bootError=null;
      ready={config:false,transactions:false,commitments:false,scheduled:false,aviation:false};
      try {
        cloudHouseholdId=await getCloudHouseholdId(cloudUser.id);
        const migrated=await refreshCloudData();
        cloudInitComplete=true;
        if(!migrated) {
          // refreshCloudData() has rendered the migration screen and set
          // cloudMigrationNeeded=true. Do not render the normal ledger here.
          return;
        }
        subscribeCloudRealtime();
        renderCloudConnectedBanner();
        render();
      } catch(e) {
        cloudUser=null; cloudHouseholdId=null; cloudMigrationNeeded=false;
        clearCloudSubscriptions();
        renderAuth(e && e.message ? e.message : String(e));
      }
    }).catch(e => {
      console.error("Cloud auth/session error", e);
      renderAuth("Cloud connection failed: " + (e && e.message ? e.message : String(e)));
    });
    return cloudAuthSerial;
  }

  function renderCloudConnectedBanner(message="") {

  // ---------- Standalone development database fallback ----------
  // The real app uses the host-provided `claude.use("db")`. When this HTML is opened
  // directly in a normal browser, that API does not exist. In that case we use a small
  // Firestore-like localStorage adapter so the full UI can be tested without touching
  // or requiring the real shared database.
  let devMode = false;
  const LOCAL_DB_KEY = "household-ledger-dev-v4";

  function createLocalDb() {
    devMode = true;
    let store = {};
    let subscribers = {};
    let counter = 0;

    function load() {
      try {
        const raw = localStorage.getItem(LOCAL_DB_KEY);
        if (raw) store = JSON.parse(raw) || {};
      } catch (e) { store = {}; }
    }
    function persist() {
      try { localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(store)); }
      catch (e) { /* fall back to in-memory for restricted browser contexts */ }
    }
    function ensureCollection(name) { if (!store[name]) store[name] = {}; return store[name]; }
    function clone(v) { return JSON.parse(JSON.stringify(v)); }
    function makeSnapshot(name) {
      const c = ensureCollection(name);
      const docs = Object.entries(c).map(([id, value]) => ({ id, data: () => clone(value) }));
      return { docs, size: docs.length, empty: docs.length === 0 };
    }
    function emit(name) {
      persist();
      const list = subscribers[name] || [];
      const snap = makeSnapshot(name);
      list.slice().forEach(fn => { try { fn(snap); } catch (e) { console.error(e); } });
    }
    function addSubscriber(name, fn) {
      (subscribers[name] ||= []).push(fn);
      fn(makeSnapshot(name));
      return () => { subscribers[name] = (subscribers[name] || []).filter(x => x !== fn); };
    }
    function parseDocPath(path) {
      const parts = String(path).split("/").filter(Boolean);
      return { collection: parts[0], id: parts[1] };
    }
    function docRef(path) {
      const {collection, id} = parseDocPath(path);
      return {
        id,
        async set(value) {
          ensureCollection(collection)[id] = clone(value || {});
          emit(collection);
        },
        async update(patch) {
          const c = ensureCollection(collection);
          c[id] = Object.assign({}, c[id] || {}, clone(patch || {}));
          emit(collection);
          if (collection === "settings" && id === "config") {
            // settings has a dedicated snapshot subscriber rather than collection snapshot
            emitDoc("settings/config");
          }
        },
        async delete() {
          delete ensureCollection(collection)[id];
          emit(collection);
          if (collection === "settings" && id === "config") emitDoc("settings/config");
        },
        onSnapshot(next, error) {
          try {
            const [col, docId] = parseDocPath(path) && [collection, id];
            const c = ensureCollection(col);
            const exists = Object.prototype.hasOwnProperty.call(c, docId);
            next({ exists, data: () => clone(c[docId] || {}) });
            const key = "__doc__:" + path;
            (subscribers[key] ||= []).push(() => {
              const existsNow = Object.prototype.hasOwnProperty.call(ensureCollection(col), docId);
              try { next({ exists: existsNow, data: () => clone(ensureCollection(col)[docId] || {}) }); } catch (e) { if (error) error(e); }
            });
            return () => { subscribers[key] = (subscribers[key] || []).filter(Boolean); };
          } catch (e) { if (error) error(e); }
        }
      };
    }
    function emitDoc(path) {
      const key = "__doc__:" + path;
      const list = subscribers[key] || [];
      list.slice().forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
    }
    function collectionRef(name) {
      const base = {
        async add(value) {
          const id = "local-" + Date.now().toString(36) + "-" + (++counter).toString(36);
          ensureCollection(name)[id] = clone(value || {});
          emit(name);
          return { id, ...docRef(name + "/" + id) };
        },
        onSnapshot(next, error) { return addSubscriber(name, next); },
        orderBy(field, direction) { return queryRef(name, field, direction, null); }
      };
      return base;
    }
    function queryRef(name, field, direction, limitValue) {
      return {
        orderBy(nextField, nextDirection) { return queryRef(name, nextField, nextDirection, limitValue); },
        limit(n) { return queryRef(name, field, direction, Number(n) || null); },
        onSnapshot(next, error) {
          const handler = snap => {
            let docs = snap.docs.slice();
            if (field) {
              docs.sort((a,b) => {
                const av = a.data()[field] || ""; const bv = b.data()[field] || "";
                const cmp = String(av).localeCompare(String(bv));
                return direction === "desc" ? -cmp : cmp;
              });
            }
            if (limitValue) docs = docs.slice(0, limitValue);
            next({ docs, size: docs.length, empty: docs.length === 0 });
          };
          return addSubscriber(name, handler);
        }
      };
    }

    load();
    const api = {
      doc: docRef,
      collection: collectionRef,
      __reset() { store = {}; persist(); Object.keys(subscribers).forEach(k => { if (!k.startsWith("__doc__:")) emit(k); else emitDoc(k.slice(9)); }); }
    };
    return api;
  }

  function markDevMode() {
    devMode = true;
    const existing = document.getElementById("dev-banner");
    if (existing) return;
    const el = document.createElement("div");
    el.id = "dev-banner";
    el.textContent = "DEVELOPMENT MODE · local browser data only · real shared ledger is not connected";
    el.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;padding:7px 12px;text-align:center;font:700 11px var(--font-ui);background:var(--warn-soft);color:var(--warn);border-top:1px solid var(--border);letter-spacing:.02em;";
    document.body.appendChild(el);
    document.body.style.paddingBottom = "52px";
  }

  async function init() {
    try {
      uiState.homeMonth = thisMonthKey();
      uiState.calendarMonth = thisMonthKey();
      uiState.selectedCalDay = null;
      document.getElementById("masthead-today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" });
      setupQuickAdd();
      if (CLOUD_MODE) {
        // Production mode: always use Supabase. Never silently fall back to
        // localStorage, because that could make the user think their entries
        // were saved to the shared household ledger when they were not.
        try {
          db = createSupabaseDb();

          // Register the auth listener BEFORE checking the current session.
          // This prevents the sign-in event from being missed and leaving the
          // user in a half-rendered/empty ledger until a manual refresh.
          supabaseClient.auth.onAuthStateChange((_event, session) => {
            setTimeout(() => { void applyCloudSession(session); }, 0);
          });

          const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
          if (sessionError) { renderAuth(sessionError.message); return; }

          if (!sessionData.session) {
            renderAuth();
            return;
          }

          await applyCloudSession(sessionData.session);
        } catch (e) {
          console.error("Supabase startup error", e);
          renderAuth("Cloud connection failed: " + (e && e.message ? e.message : String(e)));
          return;
        }
      } else {
        db = createLocalDb();
        markDevMode();
        subscribeAll();
      }
      setInterval(() => { if (document.visibilityState === "visible") render(); }, 60000);
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") render(); });
      document.addEventListener("keydown", e => { if (e.key === "Escape") { uiState.selectedCalDay = null; uiState.panelMode = null; const sheet = document.getElementById("quick-add-sheet"); if (sheet) sheet.hidden = true; render(); } });
      setTimeout(() => {
        if (!(ready.config && ready.transactions && ready.commitments && ready.scheduled && ready.aviation) && !bootError) {
          bootError = "The ledger is taking too long to load from shared storage. Check the database connection or reopen the page.";
          render();
        }
      }, 10000);
    } catch (e) {
      console.error("Ledger startup error", e);
      bootError = "The ledger failed to start: " + (e && e.message ? e.message : String(e));
      render();
    }
  }

  function markBootError(label, err) {
    console.error(label, err);
    bootError = label + (err && err.message ? ": " + err.message : "");
    render();
  }

  function subscribeAll() {
    db.doc("settings/config").onSnapshot(snap => {
      if (snap.exists) { const d = snap.data(); data.config = Object.assign({ startingBalance: 0, personA: "Jasiek", personB: "Partner", potTargets: {}, migratedV2: false, dedupedV1: false, specV3: false, schemaVersion: 0 }, d, { potTargets: d.potTargets || {}, schemaVersion: Number(d.schemaVersion || 0) }); }
      ready.config = true; maybeSeed(); maybeMigrate(); maybeDedupe(); maybeFixSpecV3(); maybeMigrateV4(); maybeMigrateV5(); render();
    }, err => markBootError("Couldn't load settings", err));

    const applyTransactions = snap => {
      data.transactions = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a,b) => (b.date || "").localeCompare(a.date || ""));
      ready.transactions = true; maybeMigrateV4(); maybeMigrateV5(); render();
    };
    db.collection("transactions").orderBy("date", "desc").onSnapshot(applyTransactions, err => {
      console.warn("Ordered transaction query failed; retrying without server-side ordering", err);
      db.collection("transactions").onSnapshot(applyTransactions, e2 => markBootError("Couldn't load transactions", e2));
    });

    db.collection("commitments").onSnapshot(snap => {
      data.commitments = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));

  // ---------- V5 Financial Safety Engine ----------
  function getForecastConfig() {
    const c = data.config || {};
    const confirmed = Array.isArray(c.forecastConfirmedIncome) && c.forecastConfirmedIncome.length ? c.forecastConfirmedIncome.slice() : ["SFE"];
    const future = Array.isArray(c.forecastFutureExpenses) ? c.forecastFutureExpenses.slice() : [];
    return {
      safetyBuffer: Math.max(0, Number(c.forecastSafetyBuffer) || 500),
      academicYearEnd: /^\d{4}-\d{2}-\d{2}$/.test(String(c.forecastAcademicYearEnd || "")) ? c.forecastAcademicYearEnd : "2027-08-31",
      confirmedIncome: confirmed,
      futureExpenses: future,
      customEnd: /^\d{4}-\d{2}-\d{2}$/.test(String(c.forecastCustomEnd || "")) ? c.forecastCustomEnd : ""
    };
  }
  function daysInMonth(mk) {
    const p = String(mk).split("-").map(Number);
    return new Date(p[0], p[1], 0).getDate();
  }
  function dateKeyLocal(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function addDaysLocal(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function monthEndDate(date) { return new Date(date.getFullYear(), date.getMonth() + 1, 0); }
  function getBudgetSpentForMonth(budgetId, mk, fallbackName) {
    return data.transactions.filter(tx => {
      if (tx.type !== "expense" || monthKey(tx.date) !== mk) return false;
      if (tx.budgetId === budgetId) return true;
      if (tx.budgetId) return false;
      const desc = String(tx.description || "").trim().toLowerCase();
      const sub = String(tx.subcategory || "").trim().toLowerCase();
      const nm = String(fallbackName || "").trim().toLowerCase();
      return (!tx.subcategory && desc === nm) || (sub === nm);
    }).reduce((s, tx) => s + (Number(tx.amount) || 0), 0);
  }
  function sumCurrentPotBalances() {
    const pots = {};
    data.transactions.forEach(tx => {
      if (tx.type === "transfer") pots[tx.pot || "Other"] = (pots[tx.pot || "Other"] || 0) + (Number(tx.amount) || 0);
      if (tx.type === "income" && tx.reserved) pots[tx.reserved] = (pots[tx.reserved] || 0) + (Number(tx.amount) || 0);
    });
    return Object.values(pots).reduce((s, x) => s + Number(x || 0), 0);
  }
  function forecastHorizonEnd(mode) {
    const today = dateFromISO(todayStr());
    if (mode === "7") return addDaysLocal(today, 7);
    if (mode === "30") return addDaysLocal(today, 30);
    if (mode === "90" || !mode) return addDaysLocal(today, 90);
    if (mode === "month") return monthEndDate(today);
    if (mode === "custom") {
      const fc = getForecastConfig();
      const chosen = uiState.forecastCustomEnd || fc.customEnd;
      const fallback = addDaysLocal(today, 90);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(String(chosen || ""))) return fallback;
      const end = dateFromISO(chosen);
      return end < today ? today : end;
    }
    return dateFromISO(getForecastConfig().academicYearEnd);
  }
  function forecastModeLabel(mode) {
    return ({"7":"next 7 days", "30":"next 30 days", "90":"next 90 days", "month":"this month", "academic":"academic year", "custom":"custom range"}[mode]) || "next 90 days";
  }
  function buildForecast(mode, extraImmediateSpend) {
    const fc = getForecastConfig();
    const today = dateFromISO(todayStr()); today.setHours(0,0,0,0);
    const end = forecastHorizonEnd(mode || "90"); end.setHours(0,0,0,0);
    const horizonDays = Math.max(0, Math.floor((end - today) / 86400000));
    const startingCash = (Number(data.config.startingBalance) || 0) + data.transactions.reduce((s, tx) => {
      if (tx.type === "income") return s + (Number(tx.amount) || 0);
      if (tx.type === "expense") return s - (Number(tx.amount) || 0);
      return s;
    }, 0);
    const events = {};
    const addEvent = (date, amount, reason, type) => {
      const d = dateKeyLocal(date);
      if (d < todayStr() || d > dateKeyLocal(end)) return;
      (events[d] ||= []).push({ amount:Number(amount)||0, reason, type:type || (amount >= 0 ? "income" : "out") });
    };

    // Expected non-Aviation income. Only sources marked confirmed are forecast.
    data.scheduled.filter(s => s.status === "expected" && s.source !== AVIATION_FUNDING_SOURCE && fc.confirmedIncome.includes(s.source)).forEach(s => {
      const d = dateFromISO(s.expectedDate); d.setHours(0,0,0,0);
      if (d >= today && d <= end) addEvent(d, Math.abs(Number(s.expectedAmount)||0), s.source + " expected", "income");
    });

    // Recurring income, using only confirmed categories.
    data.commitments.filter(c => c.kind === "income" && c.active && c.dueDay && fc.confirmedIncome.includes(c.category)).forEach(c => {
      const cursor = new Date(today.getFullYear(), today.getMonth(), 1);
      while (cursor <= end) {
        const mk = dateKeyLocal(cursor).slice(0,7);
        let d = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(Number(c.dueDay), daysInMonth(mk)));
        if (c.lastPaidMonth === mk) d = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
        if (d >= today && d <= end) addEvent(d, Math.abs(Number(c.amount)||0), c.name + " recurring income", "income");
        cursor.setMonth(cursor.getMonth()+1);
      }
    });

    // Fixed bills. Current overdue unpaid bills are treated as needing cash now.
    data.commitments.filter(c => c.active && (c.kind || "expense") === "expense" && (c.commitType || "bill") === "bill" && c.dueDay && Number(c.amount) > 0).forEach(c => {
      const cursor = new Date(today.getFullYear(), today.getMonth(), 1);
      while (cursor <= end) {
        const mk = dateKeyLocal(cursor).slice(0,7);
        const paid = c.lastPaidMonth === mk;
        let d = new Date(cursor.getFullYear(), cursor.getMonth(), Math.min(Number(c.dueDay), daysInMonth(mk)));
        if (paid || d < today) {
          if (!paid && d < today && mk === thisMonthKey()) d = new Date(today);
          else { cursor.setMonth(cursor.getMonth()+1); continue; }
        }
        if (d >= today && d <= end) addEvent(d, -Math.abs(Number(c.amount)||0), c.name + (c.essential ? " · essential bill" : " · bill"), "bill");
        cursor.setMonth(cursor.getMonth()+1);
      }
    });

    // Known future expenses entered in Planning.
    fc.futureExpenses.filter(x => x && x.active !== false && Number(x.amount) > 0 && x.date).forEach(x => {
      const d = dateFromISO(x.date); d.setHours(0,0,0,0);
      if (d >= today && d <= end) addEvent(d, -Math.abs(Number(x.amount)||0), (x.name || "Planned expense") + (x.priority ? " · " + x.priority : ""), "planned");
    });

    // Forecast variable spending as an even daily allocation of remaining/current monthly budgets.
    const budgets = data.commitments.filter(c => c.active && (c.kind || "expense") === "expense" && c.commitType === "budget" && Number(c.amount) >= 0);
    const dailyBudget = {};
    for (let offset = 0; offset <= horizonDays; offset++) {
      const d = addDaysLocal(today, offset);
      if (d > end) break;
      const mk = dateKeyLocal(d).slice(0,7);
      const dim = daysInMonth(mk);
      const prevDays = d.getDate() - 1;
      const remainingDays = Math.max(1, dim - prevDays);
      let budgetSpend = 0;
      budgets.forEach(b => {
        const limit = Math.max(0, Number(b.amount)||0);
        if (!limit) return;

    const daily = [];

      m.planned += (events[key] || []).filter(e=>e.type==="planned").reduce((s,e)=>s-e.amount,0);

  function getRunwayMonths() {

  function computeBaseTotals() {
    let income = 0, expense = 0, transfer = 0;
    const pots = {};

    const viewMk = uiState.homeMonth || realMk;
    let viewIncome = 0, viewEssential = 0, viewNonEssential = 0;
    const catSpend = {}; const subcatSpend = {};
    data.transactions.forEach(t => {
      const amt = Number(t.amount) || 0;
      if (t.type === "income") {
        income += amt;
        if (t.reserved) pots[t.reserved] = (pots[t.reserved] || 0) + amt;
        else if (monthKey(t.date) === viewMk) viewIncome += amt;
      } else if (t.type === "expense") {
        expense += amt;
        if (monthKey(t.date) === viewMk) {
          if (t.essential) viewEssential += amt; else viewNonEssential += amt;
          catSpend[t.category] = (catSpend[t.category] || 0) + amt;
          const key = t.category + "|" + (t.subcategory || "").trim().toLowerCase();
          subcatSpend[key] = (subcatSpend[key] || 0) + amt;
        }
      } else if (t.type === "transfer") {
        transfer += amt;
        const pot = t.pot || "Other";
        pots[pot] = (pots[pot] || 0) + amt;
      }
    });
    const startingBalance = Number(data.config.startingBalance) || 0;
    const cashNow = startingBalance + income - expense;
    const potTotal = Object.values(pots).reduce((a,b)=>a+b,0);
    const bills = data.commitments.filter(c => (c.kind || "expense") === "expense" && (c.commitType || "bill") === "bill");
    const budgets = data.commitments.filter(c => (c.kind || "expense") === "expense" && c.commitType === "budget");
    const recurringIncome = data.commitments.filter(c => c.kind === "income");
    const committedItems = bills.filter(c => c.active && c.essential && c.lastPaidMonth !== realMk);
    const committed = committedItems.reduce((sum,c)=>sum+(Number(c.amount)||0),0);
    const overdueBills = bills.filter(c => c.active && c.lastPaidMonth !== realMk && c.dueDay && new Date().getDate() > Number(c.dueDay));
    const safeToSpend = cashNow - potTotal - committed;
    const sfeReceived = data.scheduled.filter(s=>s.source==="SFE" && s.status==="received").reduce((sum,s)=>sum+(Number(s.actualAmount != null ? s.actualAmount : s.expectedAmount)||0),0);
    const sfeExpected = data.scheduled.filter(s=>s.source==="SFE" && s.status==="expected").reduce((sum,s)=>sum+(Number(s.expectedAmount)||0),0);
    const budgetsUsage = budgets.filter(b=>b.active).map(b=>{
      const key=b.category+"|"+(b.subcategory||b.name||"").trim().toLowerCase();
      const spent=data.transactions.filter(tx=>tx.type==="expense"&&monthKey(tx.date)===viewMk&&(tx.budgetId===b.id||(!tx.budgetId&&(tx.category+"|"+(tx.subcategory||"").trim().toLowerCase())===key)||(!tx.budgetId&&!tx.subcategory&&String(tx.description||"").trim().toLowerCase()===String(b.name||"").trim().toLowerCase()))).reduce((sum,tx)=>sum+(Number(tx.amount)||0),0);

    });
    const aviationFunding=data.aviation.filter(a=>a.kind==="funding").reduce((s,a)=>s+(Number(a.amount)||0),0);
    const aviationSpent=data.aviation.filter(a=>a.kind==="expense").reduce((s,a)=>s+(Number(a.amount)||0),0);
    const aviationLedgerBalance=aviationFunding-aviationSpent;
    const aviationContrib=pots["Aviation"]||0;
    const aviationTotal=aviationContrib+aviationLedgerBalance;

  function getCalendarEvents(mk) {

      add(Number(c.dueDay), { kind: isIncome ? "income-due" : "expense-due", label: c.name, amount: c.amount, id: c.id, paid, overdue: isCurrentMonth && !paid && !isIncome && todayDate > Number(c.dueDay) });
    });
    data.scheduled.filter(s => s.source !== AVIATION_FUNDING_SOURCE && s.status !== "received").forEach(s => {
      if (monthKey(s.expectedDate) !== mk) return;
      const day = Number(s.expectedDate.slice(8, 10)); if (!day) return;
      add(day, { kind: "scheduled", label: s.source + " — " + s.person, amount: s.expectedAmount, id: s.id, received: false, sourceScheduledId: s.id });
    });
    data.transactions.forEach(tx => {
      if (monthKey(tx.date) !== mk) return;
      const day = Number((tx.date || "").slice(8, 10)); if (!day) return;
      add(day, { kind: "spend", label: (tx.category || "") + (tx.subcategory ? " · " + tx.subcategory : ""), amount: tx.amount, txType: tx.type, id: tx.id });
    });
    return map;
  }

  function getTodaySummary() {
    const today = todayStr();
    const todayDay = new Date().getDate();
    const mk = thisMonthKey();
    const dueToday = data.commitments.filter(c => c.active && c.dueDay && Number(c.dueDay) === todayDay && c.lastPaidMonth !== mk);
    const dueTodayBills = dueToday.filter(c => (c.kind || "expense") === "expense");
    const dueTodayIncome = dueToday.filter(c => c.kind === "income");
    const expectedToday = data.scheduled.filter(s => s.status === "expected" && s.source !== AVIATION_FUNDING_SOURCE && s.expectedDate === today);
    const completedToday = data.transactions.filter(tx => tx.date === today);
    return { dueTodayBills, dueTodayIncome, expectedToday, completedToday };
  }

  function getNext7Days() {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const end = new Date(today); end.setDate(end.getDate() + 7);
    const items = [];
    data.commitments.filter(c => c.active && c.dueDay && (c.kind || "expense") === "expense").forEach(c => {
      let d = new Date(today.getFullYear(), today.getMonth(), Number(c.dueDay));
      if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, Number(c.dueDay));
      if (d <= end) {
        const mkOfOcc = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        if (c.lastPaidMonth !== mkOfOcc) items.push({ date: d, label: c.name, amount: -c.amount, kind: "bill" });
      }
    });
    data.commitments.filter(c => c.kind === "income" && c.active && c.dueDay).forEach(c => {
      let d = new Date(today.getFullYear(), today.getMonth(), Number(c.dueDay));
      if (d < today) d = new Date(today.getFullYear(), today.getMonth() + 1, Number(c.dueDay));
      if (d <= end) {
        const mkOfOcc = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
        if (c.lastPaidMonth !== mkOfOcc) items.push({ date: d, label: c.name, amount: c.amount, kind: "income" });
      }
    });
    data.scheduled.filter(s => s.status === "expected" && s.source !== AVIATION_FUNDING_SOURCE).forEach(s => {
      const d = dateFromISO(s.expectedDate);
      if (d >= today && d <= end) items.push({ date: d, label: s.source + " — " + s.person, amount: s.expectedAmount, kind: "income" });
    });
    items.sort((a, b) => a.date - b.date);
    return items.slice(0, 7);
  }

  function renderCalendarPage(t) {
    let html = heroCards(t);

    html += '<div class="card calendar-card"><div class="cal-weekdays"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div><div class="cal-grid">';
    for (let i = 0; i < startWeekday; i++) html += '<div class="cal-cell empty"></div>';

      const hasOverdue = evs.some(e => e.kind === "expense-due" && e.overdue && !e.paid);
      const netIn = evs.filter(e => (e.kind === "scheduled" || e.kind === "income-due") && !e.received && !e.paid).reduce((sum,e)=>sum+(Number(e.amount)||0),0);
      const netOut = evs.filter(e => (e.kind === "expense-due" && !e.paid) || (e.kind === "spend" && e.txType === "expense")).reduce((sum,e)=>sum+(Number(e.amount)||0),0);
      let amtLine = "";
      if (netIn > 0 && netOut > 0) amtLine = '<div class="cal-amt">+' + Math.round(netIn) + ' / -£' + Math.round(netOut) + '</div>';
      else if (netIn > 0) amtLine = '<div class="cal-amt">+' + Math.round(netIn) + '</div>';
      else if (netOut > 0) amtLine = '<div class="cal-amt neg">-£' + Math.round(netOut) + '</div>';
      let dots = "";
      evs.slice(0,5).forEach(ev => {
        let color = "var(--text-3)";
        if (ev.kind === "expense-due") color = ev.paid ? "var(--good)" : (ev.overdue ? "var(--bad)" : "var(--warn)");
        else if (ev.kind === "income-due") color = ev.paid ? "var(--good)" : "var(--accent)";
        else if (ev.kind === "scheduled") color = "var(--accent)";
        else if (ev.kind === "spend") color = ev.txType === "income" ? "var(--good)" : "var(--text-3)";
        dots += '<span class="cal-dot" style="background:' + color + ';" aria-hidden="true"></span>';
      });
      const dateKey = mk + "-" + String(d).padStart(2, "0");
      const hasNote = !!(data.config.calendarNotes && String(data.config.calendarNotes[dateKey] || "").trim());
      const aria = monthLabel(mk) + ', ' + d + (evs.length ? ', ' + evs.length + ' financial item' + (evs.length === 1 ? '' : 's') : ', no financial items') + (hasNote ? ', has note' : '');
      html += '<button type="button" class="cal-cell' + (isToday ? " today" : "") + (isSelected ? " selected" : "") + (hasOverdue ? " overdue" : "") + '" aria-label="' + esc(aria + (hasOverdue ? ", overdue payment" : "")) + '" data-action="cal-select" data-day="' + d + '"><span class="cal-daynum">' + d + (hasOverdue ? ' <span class="cal-overdue-mark" title="Overdue payment" aria-label="Overdue payment">!</span>' : '') + (hasNote ? ' <span class="cal-note-mark" title="Has note" aria-label="Has note">✎</span>' : '') + '</span>' + amtLine + '<div class="cal-dots">' + dots + '</div></button>';
    }
    html += '</div><div class="cal-legend"><span><i class="dot" style="background:var(--accent);"></i>expected</span><span><i class="dot" style="background:var(--warn);"></i>due</span><span><i class="dot" style="background:var(--bad);"></i>overdue</span><span><i class="dot" style="background:var(--good);"></i>done</span></div></div>';
    html += '</section>';
    html += '<aside class="calendar-focus-side">';
    html += '<div class="card side-card"><div class="section-title first">Today <span class="note">' + esc(new Date().toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" })) + '</span></div>';
    if (nothingToday) html += '<div class="empty">Nothing due today.</div>';
    else {
      today.dueTodayBills.forEach(c => { html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(c.name) + '</div><div class="li-sub">due today</div></div><div class="li-amt">-' + fmt(c.amount) + '</div></div>'; });
      t.overdueBills.forEach(c => { html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(c.name) + ' <span class="tag overdue">overdue</span></div><div class="li-sub">was due on the ' + esc(String(c.dueDay)) + '</div></div><div class="li-amt">-' + fmt(c.amount) + '</div></div>'; });
      today.expectedToday.forEach(s => { html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(s.source) + '</div><div class="li-sub">expected today</div></div><div class="li-amt amt-pos">+' + fmt(s.expectedAmount) + '</div></div>'; });
      today.completedToday.forEach(tx => { html += transactionRow(tx); });
    }
    html += '</div>';
    html += '<div class="mini-summary"><div class="card"><div class="card-label">' + esc(monthLabel(mk)) + ' income</div><div class="card-value">' + fmt(t.viewIncome) + '</div></div><div class="card"><div class="card-label">Spent</div><div class="card-value">' + fmt(t.viewEssential + t.viewNonEssential) + '</div></div></div>';
    html += '<div class="card side-card"><div class="section-title first">Next 7 days</div>';
    if (next7.length === 0) html += '<div class="empty">Nothing scheduled.</div>';
    else next7.forEach(item => { const dLabel = item.date.toLocaleDateString("en-GB", { day:"numeric", month:"short" }); html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(dLabel) + ' · ' + esc(item.label) + '</div></div><div class="li-amt ' + (item.amount >= 0 ? 'amt-pos' : '') + '">' + (item.amount >= 0 ? '+' : '-') + fmt(Math.abs(item.amount)) + '</div></div>'; });
    html += '</div>';
    html += '<div class="card side-card"><div class="section-title first">Fuel & budget statistics <button type="button" class="link-btn" data-action="home-log-fuel">+ Log fuel</button></div>';
    const budgetUsedPct = monthlyBudgetTotal > 0 ? Math.round((monthlyBudgetSpent / monthlyBudgetTotal) * 100) : 0;
    html += '<div class="stats-grid"><div class="card"><div class="card-label">Fuel fills</div><div class="card-value">' + fuelStats.count + '</div></div><div class="card"><div class="card-label">Avg fill</div><div class="card-value">' + fmt(fuelStats.avgFill) + '</div></div><div class="card"><div class="card-label">Avg / month</div><div class="card-value">' + fmt(fuelStats.avgMonthly) + '</div></div><div class="card"><div class="card-label">Budget used</div><div class="card-value">' + budgetUsedPct + '%</div></div><div class="card"><div class="card-label">Essential spent</div><div class="card-value">' + fmt(t.viewEssential) + '</div></div><div class="card"><div class="card-label">Non-essential</div><div class="card-value">' + fmt(t.viewNonEssential) + '</div></div></div>';
    html += '<div class="note" style="margin-top:8px;">Monthly budgets: ' + fmt(monthlyBudgetTotal) + ' total · ' + fmt(monthlyBudgetSpent) + ' spent · ' + fmt(monthlyBudgetRemaining) + ' remaining. Household figures exclude Aviation.</div>';
    if (fuelStats.avgPerLitre) html += '<div class="note">Average fuel cost: ' + fmt(fuelStats.avgPerLitre) + '/L.</div>';
    html += '<button type="button" class="link-btn" style="margin-top:8px;" data-action="toggle-fuel-history">' + (uiState.showFuelHistory ? 'Hide fill-up history' : 'Show all fill-up history') + '</button>';
    if (uiState.showFuelHistory) {
      html += '<div class="fuel-history">';
      if (fuelStats.fills.length === 0) html += '<div class="empty">No fuel fill-ups logged yet.</div>';
      else fuelStats.fills.forEach(f => { html += '<div class="list-item"><div class="li-main"><div class="li-title">Fuel fill-up</div><div class="li-sub">' + esc(f.date) + (f.litres ? ' · ' + f.litres + ' L' : '') + (f.odometer ? ' · odometer ' + f.odometer : '') + '</div></div><div class="li-amt">-' + fmt(f.amount) + '</div></div>'; });
      html += '</div>';
    }
    html += '</div>';
    html += '<div class="card side-card"><div class="section-title first">Recent account activity</div>';
    if (recent.length === 0) html += '<div class="empty">No household transactions yet.</div>';
    else { recent.forEach(tx => { html += transactionRow(tx); }); html += '<div style="margin-top:6px;"><button class="link-btn" data-action="view-all-spending">View all →</button></div>'; }
    html += '</div></aside></div>';
    return html;
  }

    const backdrop = document.getElementById("cal-day-backdrop");
    const showDay = activeTab === "calendar" && uiState.selectedCalDay && uiState.panelMode !== "aviation";
    const showAviation = uiState.panelMode === "aviation";
    if (!showDay && !showAviation) { panel.classList.remove("open"); backdrop.classList.remove("open"); panel.innerHTML = ""; return; }

    if (showAviation) html = renderAviationPanelContent(t);
    else {

      const dateLabel = esc(monthLabel(mk).split(" ")[0]) + " " + uiState.selectedCalDay;
      const noteKey = mk + "-" + String(uiState.selectedCalDay).padStart(2, "0");
      const noteValue = data.config.calendarNotes && data.config.calendarNotes[noteKey] ? data.config.calendarNotes[noteKey] : "";
      const fullDate = dateFromISO(noteKey).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
      html = '<div class="panel-head"><span style="font-weight:800;font-size:15px;">' + esc(fullDate) + '</span><button data-action="cal-panel-close">✕</button></div>';
      html += '<div class="cal-note-box"><div class="field"><label>Note</label><textarea id="cal-note-input" placeholder="Write something about this day…">' + esc(noteValue) + '</textarea></div><div class="row-actions"><button type="button" class="btn primary small" data-action="save-cal-note" data-date="'+esc(noteKey)+'">Save note</button>' + (noteValue ? '<button type="button" class="btn small danger" data-action="clear-cal-note" data-date="'+esc(noteKey)+'">Clear</button>' : '') + '</div></div>';
      if (events.length === 0) html += '<div class="empty">Nothing on this day.</div>';

          html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(ev.label || "Transaction") + '</div><div class="li-sub">logged</div></div><div class="li-amt' + (isExp ? " amt-neg" : " amt-pos") + '">' + (isExp ? "-" : "+") + fmt(Math.abs(ev.amount)) + '</div></div>';
          return;
        }

        html += '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(ev.label) + '</div><div class="li-sub">' + (ev.kind === "scheduled" ? (ev.received ? "received" : "expected income") : (ev.kind === "income-due" ? "recurring income" : "bill")) + '</div></div><div class="li-amt' + (!isExpense ? " amt-pos" : "") + '">' + (!isExpense ? "+" : "") + fmt(ev.amount) + '</div>';
        if (ev.kind === "scheduled" && !ev.received) html += '<button class="btn small" data-action="cal-jump-rec" data-id="' + ev.id + '">Mark received</button>';

        html += '</div>';
      });
    }
    panel.innerHTML = html;
    panel.classList.add("open"); backdrop.classList.add("open");
  }

  // ---------- SPENDING ----------
  function transactionRow(tx) {
    const isIncome = tx.type === "income";
    const isTransfer = tx.type === "transfer";
    const sign = isIncome ? "+" : (isTransfer ? (Number(tx.amount) < 0 ? "-" : "+") : "-");
    const amtClass = isIncome ? "amt-pos" : (isTransfer && Number(tx.amount) >= 0 ? "amt-pos" : "amt-neg");
    let title = tx.description || tx.subcategory || tx.category || "Transaction";
    if (isTransfer) title = (Number(tx.amount) < 0 ? "Withdrew from " : "Moved to ") + (tx.pot || "pot");
    const meta = [tx.date, tx.person, (!isTransfer && tx.category ? tx.category : ""), (tx.reserved ? "reserved: " + tx.reserved : "")].filter(Boolean).join(" · ");
    return '<div class="list-item"><div class="li-main"><div class="li-title">' + esc(title) + (tx.essential ? ' <span class="tag essential">essential</span>' : '') + '</div>' +
      '<div class="li-sub">' + esc(meta) + (tx.notes ? " · " + esc(tx.notes) : "") + '</div></div>' +
      '<div class="li-amt ' + amtClass + '">' + sign + fmt(Math.abs(tx.amount)) + '</div>' +
      '<button type="button" class="btn small" data-action="edit-tx" data-id="' + tx.id + '">Edit</button><button type="button" class="btn small danger" data-action="del-tx" data-id="' + tx.id + '">✕</button></div>';
  }

    } else {
      html += '<div class="add-section closed"><button type="button" class="btn primary" data-action="open-expense-form">+ Add expense</button></div>';
    }
    const expenses = data.transactions.filter(tx => tx.type === "expense");
    const months = Array.from(new Set(expenses.map(tx => monthKey(tx.date)))).filter(Boolean).sort().reverse();
    html += '<div class="section-title first">Spending history</div>';

  function dateNowDay() { return new Date().getDate(); }
  function getFuelStats() {
    const fills = data.transactions.filter(tx => tx.type === "expense" && tx.category === "Transport" && (tx.subcategory || "").toLowerCase() === "fuel");
    const total = fills.reduce((s, f) => s + (Number(f.amount) || 0), 0);
    const count = fills.length;
    const avgFill = count > 0 ? total / count : 0;
    const byMonth = {};
    fills.forEach(f => { const mk = monthKey(f.date); byMonth[mk] = (byMonth[mk] || 0) + (Number(f.amount) || 0); });
    const monthsCount = Object.keys(byMonth).length;
    const avgMonthly = monthsCount > 0 ? total / monthsCount : 0;
    const withLitres = fills.filter(f => Number(f.litres) > 0);
    const totalLitres = withLitres.reduce((s, f) => s + (Number(f.litres) || 0), 0);
    const totalCostWithLitres = withLitres.reduce((s, f) => s + (Number(f.amount) || 0), 0);
    const avgPerLitre = totalLitres > 0 ? totalCostWithLitres / totalLitres : null;
    fills.sort((a,b) => (b.date || "").localeCompare(a.date || ""));
    return { total, count, avgFill, avgMonthly, avgPerLitre, fills };
  }

    const today = dateFromISO(todayStr());

  // ---------- ICS / export ----------
  function icsEscape(s) { return String(s || "").replace(/\\/g, "\\\\").replace(/,/g, "\\,").replace(/;/g, "\\;").replace(/\n/g, "\\n"); }
  function icsStamp() { const d = new Date(); return d.getUTCFullYear() + String(d.getUTCMonth() + 1).padStart(2, "0") + String(d.getUTCDate()).padStart(2, "0") + "T" + String(d.getUTCHours()).padStart(2, "0") + String(d.getUTCMinutes()).padStart(2, "0") + String(d.getUTCSeconds()).padStart(2, "0") + "Z"; }
  function buildICS() {
    const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Household Ledger//EN", "CALSCALE:GREGORIAN"];
    data.scheduled.filter(s => s.status !== "received" && s.source !== AVIATION_FUNDING_SOURCE).forEach(s => {
      const dt = (s.expectedDate || "").replace(/-/g, ""); if (!dt) return;
      lines.push("BEGIN:VEVENT", "UID:sched-" + s.id + "@household-ledger", "DTSTAMP:" + icsStamp(), "DTSTART;VALUE=DATE:" + dt, "SUMMARY:" + icsEscape(s.source + " — " + s.person + " expected (" + fmt(s.expectedAmount) + ")"));
      if (s.notes) lines.push("DESCRIPTION:" + icsEscape(s.notes));
      lines.push("END:VEVENT");
    });
    data.commitments.filter(c => c.active && c.dueDay).forEach(c => {
      const now = new Date();
      const anchor = now.getFullYear() + String(now.getMonth() + 1).padStart(2, "0") + String(Number(c.dueDay)).padStart(2, "0");
      lines.push("BEGIN:VEVENT", "UID:commit-" + c.id + "@household-ledger", "DTSTAMP:" + icsStamp(), "DTSTART;VALUE=DATE:" + anchor, "RRULE:FREQ=MONTHLY;BYMONTHDAY=" + Number(c.dueDay), "SUMMARY:" + icsEscape((c.kind === "income" ? "+ " : "") + c.name + " (" + fmt(c.amount) + ")"));
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n");
  }
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function formatForecastDate(date) {
    return date.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  }

  function getHouseholdTrackingStartDate() {
    const sfeDates = data.scheduled.filter(s => s.source === "SFE" && /^\d{4}-\d{2}-\d{2}$/.test(String(s.expectedDate || ""))).map(s => s.expectedDate);
    if (!sfeDates.length) return null;
    sfeDates.sort();
    return dateFromISO(sfeDates[0]);
  }

  function buildActualHistory(endDate) {
    const start = getHouseholdTrackingStartDate();
    if (!start) return [];
    const requestedEnd = new Date(endDate); requestedEnd.setHours(0,0,0,0);
    const today = dateFromISO(todayStr()); today.setHours(0,0,0,0);
    const end = requestedEnd < today ? requestedEnd : today;
    start.setHours(0,0,0,0);
    if (start > end) return [];

    const byDate = {};
    data.transactions.forEach(tx => {
      if ((tx.type !== "income" && tx.type !== "expense") || !/^\d{4}-\d{2}-\d{2}$/.test(String(tx.date || ""))) return;
      const d = dateFromISO(tx.date); d.setHours(0,0,0,0);
      if (d < start || d > end) return;
      (byDate[tx.date] ||= []).push(tx);
    });

    let balance = Number(data.config.startingBalance) || 0;
    const daily = [];
    for (let d = new Date(start); d <= end; d = addDaysLocal(d, 1)) {
      const key = dateKeyLocal(d);
      let income = 0, expense = 0;
      const events = [];
      (byDate[key] || []).forEach(tx => {
        const amt = Math.abs(Number(tx.amount) || 0);
        if (tx.type === "income") {
          income += amt;
          events.push({ amount: amt, reason: tx.description || tx.category || "Income", type: "income" });
        } else {
          expense += amt;
          events.push({ amount: -amt, reason: tx.description || tx.subcategory || tx.category || "Spending", type: "actual" });
        }
      });
      const net = income - expense;
      balance += net;
      daily.push({ date:new Date(d), key, balance, net, income, expense, events });
    }
    return daily;
  }
